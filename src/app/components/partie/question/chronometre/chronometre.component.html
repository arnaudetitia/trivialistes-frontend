<div class="chronometre-container">
  @if (tempsRestant() > 0) {
    <div
      class="chrono-fill"
      [style.height.%]="(100 * tempsRestant()) / tempsTotal"
      [ngClass]="{
        critique: tempsRestant() > 5 && tempsRestant() <= 20,
        'last-seconds': tempsRestant() <= 5,
      }"
    ></div>
  }
</div>
