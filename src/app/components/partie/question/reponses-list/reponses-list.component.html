<div class="reponse-list-container">
  <mat-grid-list cols="2" gutterSize="3vh" rowHeight="12vh">
    @for (reponse of reponsesList; track reponse; let i = $index) {
      <mat-grid-tile
        class="champ-reponse"
        [ngClass]="{
          'show-reponse': reponseDisplay().get(reponse) || admin,
          'reponse-donnee': reponseDonnee().get(reponse),
          'mort-subite': mortSubite,
        }"
        (click)="revealReponses(reponse)"
        >{{ reponseDisplay().get(reponse) || admin ? reponse : i + 1 }}</mat-grid-tile
      >
    }
  </mat-grid-list>
</div>
