<div class="scores-container">
  <div class="table-wrapper">
    <table mat-table [dataSource]="resultatManches">
      <ng-container matColumnDef="manche">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let resultat">
          <span *ngIf="!resultat.mortsubite; else mortSubiteRow"
            >Manche {{ resultat.numeroManche }}</span
          >
          <ng-template #mortSubiteRow>
            <span>Mort Subite</span>
          </ng-template>
        </td>
      </ng-container>

      <ng-container matColumnDef="scoresEquipeA">
        <th mat-header-cell *matHeaderCellDef>{{ nomEquipes[0] }}</th>
        <td
          mat-cell
          *matCellDef="let resultat"
          [ngClass]="{
            'gagnant-manche': resultat.vainqueurManche === nomEquipes[0],
          }"
        >
          <div class="result-manche-container">
            {{ resultat.scoreEquipeA }}
            <span *ngIf="resultat.equipeChoix === nomEquipes[0]">C</span>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="scoresEquipeB">
        <th mat-header-cell *matHeaderCellDef>{{ nomEquipes[1] }}</th>
        <td
          mat-cell
          *matCellDef="let resultat"
          [ngClass]="{
            'gagnant-manche': resultat.vainqueurManche === nomEquipes[1],
          }"
        >
          <div class="result-manche-container">
            {{ resultat.scoreEquipeB }}
            <span *ngIf="resultat.equipeChoix === nomEquipes[1]">C</span>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <div
    class="champ-resultat"
    *ngIf="resultatManches.length >= 6"
    [ngClass]="{
      egalite: !vainqueurPartie,
    }"
  >
    <div *ngIf="vainqueurPartie; else mortSubiteActivated">
      L'équipe {{ vainqueurPartie }} à gagné cette partie !
    </div>
    <ng-template #mortSubiteActivated>
      <div>Passons à la mort subite !</div>
    </ng-template>
  </div>
</div>
